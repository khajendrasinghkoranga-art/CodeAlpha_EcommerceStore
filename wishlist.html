<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NOVA Store — Wishlist</title>
  <base href="/">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive-fixes.css">
</head>
<body>
  <main class="section">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">♡ Wishlist</span>
        <h1 class="section-title">Saved <span class="gradient-text">Favorites</span></h1>
        <p class="section-subtitle">Your saved products are stored locally in your browser for easy access.</p>
      </div>
      <div id="wishlist-grid" class="products-grid"></div>
      <div id="wishlist-empty" class="cart-empty" style="display:none; margin-top: 2rem;">
        <div class="cart-empty-icon">♡</div>
        <div class="cart-empty-text">Your wishlist is empty. Add a product to save it here.</div>
      </div>
    </div>
  </main>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const wishlistGrid = document.getElementById('wishlist-grid');
      const wishlistEmpty = document.getElementById('wishlist-empty');
      const wishlistSummary = document.createElement('div');
      const wishlistToolbar = document.createElement('div');
      const sortSelect = document.createElement('select');
      const clearBtn = document.createElement('button');

      wishlistSummary.className = 'wishlist-summary';
      wishlistToolbar.className = 'wishlist-toolbar';
      sortSelect.id = 'wishlist-sort-select';
      sortSelect.className = 'sort-select';
      clearBtn.className = 'btn btn-secondary';
      clearBtn.id = 'wishlist-clear-btn';
      clearBtn.textContent = 'Clear Wishlist';

      sortSelect.innerHTML = `
        <option value="recent">Sort: Recent</option>
        <option value="name">Name A–Z</option>
        <option value="price-low">Price: Low → High</option>
        <option value="price-high">Price: High → Low</option>
      `;

      wishlistSummary.innerHTML = `
        <span id="wishlist-count-badge" class="section-tag">♡ 0 items</span>
        <span id="wishlist-total" class="section-tag" style="margin-left:auto">Total: ₹0</span>
      `;
      wishlistToolbar.appendChild(wishlistSummary);
      wishlistToolbar.appendChild(sortSelect);
      wishlistToolbar.appendChild(clearBtn);
      wishlistGrid.parentNode.insertBefore(wishlistToolbar, wishlistGrid);

      const savedWishlist = localStorage.getItem('nova_wishlist');
      let wishlistIds = savedWishlist ? JSON.parse(savedWishlist) : [];
      const PRODUCTS_SOURCE = (typeof PRODUCTS !== 'undefined' ? PRODUCTS : []);
      const productMap = new Map(PRODUCTS_SOURCE.map(product => [product.id, product]));
      let currentSort = 'recent';

      function formatPrice(value) {
        const num = Number(value) || 0;
        return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num);
      }

      function getWishlistItems() {
        return wishlistIds
          .map(id => productMap.get(id))
          .filter(Boolean);
      }

      function saveWishlist(ids) {
        wishlistIds = ids;
        localStorage.setItem('nova_wishlist', JSON.stringify(wishlistIds));
      }

      function updateSummary(items) {
        const countBadge = document.getElementById('wishlist-count-badge');
        const totalLabel = document.getElementById('wishlist-total');
        const totalValue = items.reduce((sum, product) => sum + (product.price || 0), 0);
        if (countBadge) countBadge.textContent = `♡ ${items.length} item${items.length === 1 ? '' : 's'}`;
        if (totalLabel) totalLabel.textContent = `Total: ${formatPrice(totalValue)}`;
      }

      function sortItems(items) {
        if (currentSort === 'name') {
          return [...items].sort((a, b) => a.name.localeCompare(b.name));
        }
        if (currentSort === 'price-low') {
          return [...items].sort((a, b) => a.price - b.price);
        }
        if (currentSort === 'price-high') {
          return [...items].sort((a, b) => b.price - a.price);
        }
        return items;
      }

      function renderWishlist() {
        const items = sortItems(getWishlistItems());

        if (!items.length) {
          if (wishlistGrid) wishlistGrid.style.display = 'none';
          if (wishlistEmpty) wishlistEmpty.style.display = 'block';
          updateSummary([]);
          return;
        }

        if (wishlistGrid) wishlistGrid.style.display = '';
        if (wishlistEmpty) wishlistEmpty.style.display = 'none';

        wishlistGrid.innerHTML = items.map(product => `
          <div class="product-card wishlist-card" data-product-id="${product.id}" data-name="${product.name}" data-price="${product.price}" data-image="${product.image}">
            <div class="product-image-wrapper">
              <img src="${product.image}" alt="${product.name}" class="product-image" loading="lazy">
            </div>
            <div class="product-info">
              <div class="product-category">${product.category}</div>
              <div class="product-name">${product.name}</div>
              <div class="product-weight">${product.specs?.Weight || 'Weight info available in product details'}</div>
              <div class="product-price">${formatPrice(product.price)}</div>
              <div class="product-footer wishlist-footer">
                <button class="btn btn-secondary wishlist-remove-btn" data-product-id="${product.id}">Remove</button>
                <button class="btn btn-primary wishlist-addcart-btn" data-product-id="${product.id}">Add to Cart</button>
              </div>
            </div>
          </div>
        `).join('');

        updateSummary(items);
      }

      function removeFromWishlist(productId) {
        const nextIds = wishlistIds.filter(id => id !== productId);
        saveWishlist(nextIds);
        renderWishlist();
        showToast('Removed from wishlist', 'info');
      }

      wishlistGrid.addEventListener('click', (event) => {
        const removeBtn = event.target.closest('.wishlist-remove-btn');
        const addCartBtn = event.target.closest('.wishlist-addcart-btn');
        if (removeBtn) {
          const productId = removeBtn.dataset.productId;
          removeFromWishlist(productId);
          return;
        }
        if (addCartBtn) {
          const productId = addCartBtn.dataset.productId;
          if (window.novaStore && typeof window.novaStore.addToCart === 'function') {
            window.novaStore.addToCart(productId);
            showToast('Added to cart', 'success');
          } else {
            showToast('Cart is not available yet', 'warning');
          }
        }
      });

      sortSelect.addEventListener('change', () => {
        currentSort = sortSelect.value;
        renderWishlist();
      });

      clearBtn.addEventListener('click', () => {
        if (!wishlistIds.length) return;
        saveWishlist([]);
        renderWishlist();
        showToast('Wishlist cleared', 'info');
      });

      renderWishlist();
    });
  </script>
</body>
</html>
